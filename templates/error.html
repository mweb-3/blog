<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<title>something went wrong</title>
<link rel="stylesheet" href="/static/css/global.css">
<link rel="stylesheet" href="/static/css/error.css">
{% include '_theme_head.html' %}
</head>
<body>
{% include '_theme_button.html' %}
<div class="error-page">
    <h1>something went wrong</h1>
    <p class="error-message">sorry about that — try going back or refreshing the page.</p>

    <details class="error-details">
        <summary class="error-toggle">details</summary>
        <div class="error-box">
            <button class="copy-btn" onclick="copyError()" aria-label="Copy error message">copy</button>
            <pre class="error-text" id="error-text">{{ error }}</pre>
        </div>
    </details>

    <a class="btn btn-quiet" href="/">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3.5 5 8l4.5 4.5"/></svg>
        Back to home
    </a>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
function copyError() {
    const text = document.getElementById('error-text').textContent;
    navigator.clipboard.writeText(text).then(() => {
        const t = document.getElementById('toast');
        t.textContent = 'copied to clipboard';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    });
}
</script>
</body>
</html>
