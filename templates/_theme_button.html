<div class="top-toggles">
    {% if authorized %}
    <a class="top-toggle admin-toggle is-signed-in" href="/admin" aria-label="Dashboard" title="Dashboard">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.25" y="2.25" width="4.5" height="4.5" rx="1"/>
            <rect x="9.25" y="2.25" width="4.5" height="4.5" rx="1"/>
            <rect x="2.25" y="9.25" width="4.5" height="4.5" rx="1"/>
            <rect x="9.25" y="9.25" width="4.5" height="4.5" rx="1"/>
        </svg>
    </a>
    {% else %}
    <a class="top-toggle admin-toggle" href="/login" aria-label="Sign in" title="Sign in">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="10" r="2.75"/>
            <path d="M7.95 8.05 13.5 2.5"/>
            <path d="M11.25 4.75 13 6.5"/>
            <path d="M9.5 6.5 11 8"/>
        </svg>
    </a>
    {% endif %}
    <button class="top-toggle theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">
        <svg class="theme-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><line x1="8" y1="1.5" x2="8" y2="3"/><line x1="8" y1="13" x2="8" y2="14.5"/><line x1="1.5" y1="8" x2="3" y2="8"/><line x1="13" y1="8" x2="14.5" y2="8"/><line x1="3.3" y1="3.3" x2="4.3" y2="4.3"/><line x1="11.7" y1="11.7" x2="12.7" y2="12.7"/><line x1="3.3" y1="12.7" x2="4.3" y2="11.7"/><line x1="11.7" y1="4.3" x2="12.7" y2="3.3"/></svg>
        <svg class="theme-moon" viewBox="0 0 16 16" fill="currentColor" stroke="none"><path d="M13.6 9.4a5.5 5.5 0 1 1-7-7 4.5 4.5 0 0 0 7 7z"/></svg>
    </button>
</div>
