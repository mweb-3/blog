<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<title>updates</title>
<link rel="stylesheet" href="/static/css/global.css">
</head>
<body>
<h1>updates</h1>
<hr>
{% for post in posts %}
<a href="/post/{{ post.id }}">
<div class="post">
    <h2>{{ post.title }}</h2>
    {% if loop.first %}<span class="badge">&#x2022; latest</span>{% endif %}
    <p class="date">{{ post.created_at | relative }} &middot; {{ post.created_at | fmt_date }}</p>
    <p class="description">{{ post.content }}</p>
</div>
</a>
{% endfor %}
<div class="footer">
    {% if authorized == 'true'%}
    <a href="/new">new post</a> &middot; <a href="/admin">manage</a>
    {% else %}
    <a href="/login">login</a>
    {% endif %}

</div>
</body>
</html>
