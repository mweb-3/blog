<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<title>updates</title>
<style>
body {
    font-family: 'DM Sans', sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 2rem 1.25rem;
}
h1 {
    font-family: 'Lora', serif;
    font-weight: 400;
    margin-bottom: 0.25rem;
}
hr {
    border: none;
    border-top: 0.5px solid lightgray;
    margin-bottom: 2rem;
}
.post {
    padding: 1.25rem 1.5rem;
    border: 1px solid lightgray;
    border-radius: 12px;
    transition: 150ms;
    margin-bottom: 1rem;
}
.post:hover {
    background-color: #f5f5f5;
}
.post h2 {
    font-family: 'Lora', serif;
    font-weight: 500;
    font-size: 1.1rem;
    margin: 0 0 0.3rem;
}
.date {
    font-size: 12px;
    color: gray;
    margin: 0 0 0.6rem;
}
a {
    color: inherit;
    text-decoration: none;
}
.description {
    font-size: 14px;
    color: gray;
    line-height: 1.6;
    margin: 0;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
}
.footer {
    margin-top: 2rem;
    font-size: 13px;
    color: gray;
}
</style>
</head>
<body>
<h1>updates</h1>
<hr>
{% for post in posts %}
<a href="/post/{{ post.id }}">
<div class="post">
    <h2>{{ post.title }}</h2>
    <p class="date">{{ post.created_at | relative }} &middot; {{ post.created_at | fmt_date }}</p>
    <p class="description">{{ post.content }}</p>
</div>
</a>
{% endfor %}
<div class="footer">
    <a href="/new">new post</a> &middot; <a href="/admin">manage</a>
</div>
</body>
</html>
