// --- STATE ----------------------------------------------------------------

let state = {
  section: null,
  questions: [],
  index: 0,
  missed: [],
  answeredCurrent: false
};

const stage = document.getElementById('stage');
const nav = document.getElementById('nav');
const sectionLabel = document.getElementById('section-label');

// --- BUILD NAV ------------------------------------------------------------

function buildNav() {
  nav.innerHTML = '';
  Object.keys(SECTIONS).forEach(name => {
    const btn = document.createElement('button');
    btn.textContent = name;
    btn.dataset.section = name;
    btn.addEventListener('click', () => startSection(name));
    nav.appendChild(btn);
  });
}

function setActiveNav(name) {
  [...nav.querySelectorAll('button')].forEach(b => {
    b.classList.toggle('active', b.dataset.section === name);
  });
}

// --- UTIL -----------------------------------------------------------------

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickDistractors(correct, pool, n = 3) {
  const others = pool.filter(x => x.d !== correct.d);
  return shuffle(others).slice(0, n);
}

// --- FLOW -----------------------------------------------------------------

function startSection(name) {
  state.section = name;
  state.questions = shuffle(SECTIONS[name]);
  state.index = 0;
  state.missed = [];
  state.answeredCurrent = false;
  sectionLabel.textContent = name;
  setActiveNav(name);
  renderQuestion();
}

function renderQuestion() {
  const q = state.questions[state.index];
  const pool = SECTIONS[state.section];
  const distractors = pickDistractors(q, pool, 3);
  const choices = shuffle([q, ...distractors]);
  const total = state.questions.length;
  const pct = Math.round((state.index / total) * 100);

  stage.innerHTML = `
    <div class="progress">
      <span>${state.section}</span>
      <span>${state.index + 1} / ${total}</span>
    </div>
    <div class="progress-bar" style="--pct:${pct}%"></div>
    <div class="question">Define</div>
    <div class="word">${q.w}</div>
    <ul class="choices">
      ${choices.map((c, i) => `
        <li class="choice" data-correct="${c.d === q.d}" data-def="${encodeURIComponent(c.d)}">
          <span class="letter">${String.fromCharCode(65 + i)}</span>
          ${c.d}
        </li>
      `).join('')}
    </ul>
    <div id="feedback-slot"></div>
  `;

  state.answeredCurrent = false;

  stage.querySelectorAll('.choice').forEach(el => {
    el.addEventListener('click', () => handleAnswer(el, q));
  });
}

function handleAnswer(el, q) {
  if (state.answeredCurrent) return;
  state.answeredCurrent = true;

  const isCorrect = el.dataset.correct === 'true';

  stage.querySelectorAll('.choice').forEach(c => {
    c.classList.add('disabled');
    if (c.dataset.correct === 'true') {
      c.classList.add('correct');
    } else if (c === el) {
      c.classList.add('incorrect');
    }
  });

  if (!isCorrect) {
    state.missed.push(q);
    showFeedback(q);
  } else {
    showNext(false);
  }
}

function showFeedback(q) {
  const slot = document.getElementById('feedback-slot');
  slot.innerHTML = `
    <div class="feedback">
      <div class="label">Mnemonic</div>
      <div class="mnemonic-title">${q.w} — ${q.d}</div>
      <p>${q.m}</p>
      <div class="next-row">
        <button class="ghost" id="next-btn">${isLast() ? 'See Results →' : 'Next →'}</button>
      </div>
    </div>
  `;
  document.getElementById('next-btn').addEventListener('click', advance);
}

function showNext(autoAdvance) {
  const slot = document.getElementById('feedback-slot');
  slot.innerHTML = `
    <div class="feedback" style="border-style:dashed;">
      <div class="label">Correct</div>
      <p style="font-style:italic;">Nicely done.</p>
      <div class="next-row">
        <button class="ghost" id="next-btn">${isLast() ? 'See Results →' : 'Next →'}</button>
      </div>
    </div>
  `;
  document.getElementById('next-btn').addEventListener('click', advance);
}

function isLast() {
  return state.index >= state.questions.length - 1;
}

function advance() {
  if (isLast()) {
    showResults();
  } else {
    state.index++;
    renderQuestion();
  }
}

function showResults() {
  const total = state.questions.length;
  const correct = total - state.missed.length;
  const pct = Math.round((correct / total) * 100);

  let summary;
  if (pct === 100) summary = 'A perfect run. You know this section cold.';
  else if (pct >= 85) summary = 'Strong showing. A few stragglers below.';
  else if (pct >= 70) summary = 'Solid foundation, room to tighten up.';
  else if (pct >= 50) summary = 'Halfway there. Review the misses, then go again.';
  else summary = 'Worth another pass. Mnemonics below.';

  const missedHTML = state.missed.length === 0
    ? `<p style="font-style:italic; color: var(--muted);">Nothing missed. Move on to another section.</p>`
    : state.missed.map(q => `
        <div class="missed-item">
          <div class="missed-word">${q.w}</div>
          <div class="missed-def">${q.d}</div>
          <div class="missed-mnemonic">${q.m}</div>
        </div>
      `).join('');

  stage.innerHTML = `
    <div class="results">
      <div class="eyebrow">Results · ${state.section}</div>
      <h2>Here's how it went.</h2>
      <div class="score-line">${correct}<span class="denom">/${total}</span></div>
      <div class="summary">${summary} · ${pct}%</div>
      <div class="missed-section">
        <h3>${state.missed.length === 0 ? 'No Misses' : 'Words to Revisit'}</h3>
        ${missedHTML}
      </div>
      <div class="results-actions">
        <button class="primary" id="retry">Retry This Section</button>
        <button class="ghost" id="pick-new">Pick Another Section</button>
      </div>
    </div>
  `;

  document.getElementById('retry').addEventListener('click', () => startSection(state.section));
  document.getElementById('pick-new').addEventListener('click', renderStart);
}

function renderStart() {
  state.section = null;
  setActiveNav(null);
  sectionLabel.textContent = '— Choose a section —';
  stage.innerHTML = `
    <div class="start-screen">
      <p>A multiple-choice quiz over Chapter 34's running vocabulary, broken into nine sections.</p>
      <p>Each prompt shows a Latin word; pick the right English meaning from four options drawn from the same section. Misses get a mnemonic to help it stick — and the full list of missed words appears at the end.</p>
      <div class="meta">Pick a section above to begin.</div>
    </div>
  `;
}

// --- INIT -----------------------------------------------------------------

buildNav();
renderStart();
</script>
