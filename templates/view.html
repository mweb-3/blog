<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<title>{{ post.title }}</title>
<link rel="stylesheet" href="/static/css/global.css">
<link rel="stylesheet" href="/static/css/view.css">
{% include '_theme_head.html' %}
</head>
<body>
{% include '_theme_button.html' %}
<div class="page-toolbar">
    <a class="btn btn-quiet" href="/">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3.5 5 8l4.5 4.5"/></svg>
        Back
    </a>
    {% if authorized %}
    <div class="toolbar-actions">
        <a class="btn btn-ghost" href="/edit/{{ post.id }}">Edit</a>
        <a class="btn btn-primary" href="/new">+ New</a>
    </div>
    {% endif %}
</div>
<h1>{{ post.title }}</h1>
<p class="date">{{ post.created_at | fmt_date }}</p>
<hr>
<div class="content">{{ post.content | safe }}</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/static/js/footnotes-view.js"></script>
<!-- <script src="/static/js/toc.js"></script> -->
<script>
const params = new URLSearchParams(window.location.search);
const t = document.getElementById('toast');
if (params.has('posted')) {
    t.textContent = 'post published';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
    history.replaceState(null, '', window.location.pathname);
}
</script>
</body>
</html>
